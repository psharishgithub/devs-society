# Docker Compose file for Devs Society Portal
# This file orchestrates both frontend and backend services

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devs-society-backend
    environment:
      - NODE_ENV=production
      - PORT=5050
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    networks:
      - devs-society-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devs-society-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5050
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - devs-society-network
    restart: unless-stopped

networks:
  devs-society-network:
    driver: bridge

volumes:
  uploads:
    driver: local
